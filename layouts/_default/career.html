{{ define "main" }}

    <a class="article-back" href="{{ site.Home.RelPermalink }}">返回首页</a>
    <header class="article-header">
      <h1>{{ .Title }}</h1>
      <p class="article-intro">{{ .Params.description }}</p>
    </header>
    <div class="article-body">{{ .Content }}</div>
  </article>
{{ end }}
