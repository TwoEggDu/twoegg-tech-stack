{{ with site.Home.OutputFormats.Get "JSON" }}
  <form class="site-search" data-search data-search-index-url="{{ .RelPermalink }}" role="search">
    <label class="sr-only" for="site-search-input">搜索站内内容</label>
    <div class="site-search-field">
      <span class="site-search-prefix" aria-hidden="true">Search</span>
      <input
        id="site-search-input"
        class="site-search-input"
        type="search"
        name="q"
        placeholder="搜索文章、标签、栏目"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="search"
        aria-expanded="false"
      >
    </div>
    <div class="search-panel" data-search-panel hidden>
      <p class="search-status" data-search-status>输入关键词搜索文章、标签和栏目。</p>
      <ul class="search-results" data-search-results hidden></ul>
    </div>
  </form>
{{ end }}
