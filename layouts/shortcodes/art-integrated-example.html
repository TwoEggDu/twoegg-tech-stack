<figure aria-label="综合场景的制作依赖和动作时长修改示意" style="margin:1.5rem 0">
  <div role="region" aria-label="从各工种原稿到交互及版本比较，可横向查看" tabindex="0" style="overflow-x:auto">

      <title id="integrated-example-title">产物沿引用汇合，修改沿依赖传播</title>
      <desc id="integrated-example-desc">三条制作支线分别提供角色与动作、庭院空间、纹理与效果，汇合到角色模板、表现配置与场景入口。玩家从入口走向目标，经过距离与遮挡检查，在释放通知后接受目标反馈或取消重开。下方对比24帧每秒时Cast由49到73帧改为49到85帧，释放由0.5秒改为0.75秒，表现恢复由1.1秒改为1.6秒。全部内容为教学设计，不代表真实工程和运行结果。</desc>

      <g font-family="system-ui, sans-serif" fill="#304b40">
        <text x="22" y="32" font-size="20" font-weight="600">先保留制作来源，再连接组装与运行</text>
        <g fill="#f0f4ed" stroke="#c6d0c1">

          <g font-size="14" fill="#526b58"><text x="147" y="103">设计稿 → 模型 / 绑定 / 动画</text><text x="430" y="103">模块 → 摆放 / 碰撞 / 光照</text><text x="713" y="103">PSD → PNG / 材质 / 粒子</text></g>
          <g font-size="13" fill="#657b68"><text x="147" y="125">FBX、Avatar、Clip 与挂点</text><text x="430" y="125">Scene、目标与观察条件</text><text x="713" y="125">Charge / Release / Impact</text></g>
        </g>
        <g fill="none" stroke="#728977" stroke-width="1.7" marker-end="url(#integrated-example-arrow)">

        <g text-anchor="middle" font-size="16" font-weight="600"><text x="144" y="328">穿门、绕行、接近目标</text><text x="430" y="328">请求 → 释放 → 复查</text><text x="716" y="328">反馈、取消、离场与重开</text></g>
        <g text-anchor="middle" font-size="13" fill="#657b68"><text x="144" y="351">身体与镜头分别观察</text><text x="430" y="351">距离与环境遮挡只是教学规则</text><text x="716" y="351">反馈接受不等于画面或伤害验证</text></g>

        <path d="M22 397H838" stroke="#d9dfd5"/>
