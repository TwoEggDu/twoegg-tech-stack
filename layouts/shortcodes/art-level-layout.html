      <title id="level-layout-title">从入口绕过屏风，再观察庭院后方目标</title>
      <desc id="level-layout-desc">左侧是8乘6米庭院的俯视原理图，入口净宽2米，内部屏风位于X3至5、Z2。蓝色箭头从A经B、C到D，代表设计走查路线而非实际导航结果。橙色虚线表示入口到目标的视线被屏风截断，绿色线表示C点的观察关系。右侧分别列出视觉、角色碰撞、导航与镜头检查。本图未生成实际NavMesh，也没有运行或烘焙结果。</desc>
