    label: "从技能规则看测试与回归怎样组织"
  - title: "美术 × 客户端"
    value: "把资源、引用与表现约定，接到版本库、构建产物和设备实际内容。"
    page: "engineering-journey/production-resource-completeness.md"
    label: "从一次资源漏提交看交接怎样补齐"
  - title: "客户端 × 服务端"
    value: "从客户端的协议、配置与更新需求，继续检查两端版本怎样配套。"
    page: "delivery-engineering/delivery-server-versioning-01-coordination.md"
    label: "看客户端与服务端的版本协同"
  - title: "研发 × QA × 发布"
    value: "围绕同一份候选，交接变更范围、检查结果、测试结论与发布内容。"
