mainline:
  - page: "performance/game-performance-read-does-not-mean-ready.md"
    label: "先定可用边界"
    value: "把字节、运行时对象、渲染与交互分开，明确你说的启动完成或加载完成停在哪一步。"
  - page: "engine-toolchain/unity-assetbundle-pack-granularity-coarse-vs-fine-dependencies-redundancy.md"
    label: "再看依赖与粒度"
    value: "按变化、复用与加载时序画包边界，理解碎包、公共依赖和冗余的代价。"
  - page: "engine-toolchain/unity-assetbundle-runtime-loading-chain-download-cache-dependencies-unload.md"
    label: "拆开运行时加载链"
    value: "区分取得文件、缓存命中、依赖满足、恢复资产与实例化，找到真正阻塞的层。"
  - page: "performance/game-performance-dangerous-operations-timing.md"
    label: "安排异步与加载时机"
    value: "判断哪些工作能前置、推迟或分帧，哪些仍会在主线程与渲染关键路径收尾。"
  - page: "performance/game-performance-memory-behavior.md"
    label: "控制峰值与波动"
    value: "从工作集、临时对象和生命周期看加载峰值，避免只盯内存总量。"
  - page: "delivery-engineering/delivery-resource-pipeline-05-loading-lifecycle.md"
    label: "明确持有与释放"
    value: "将加载调度、所有权、退出与失败处理连起来，分别检查时延、关键帧和资源持有。"
  - page: "code-quality/baseline-budgets-in-ci.md"
    label: "接回验证与交付"
    value: "固定样本、环境、阈值和超线动作，让本轮加载改动能够在后续版本中比较。"
