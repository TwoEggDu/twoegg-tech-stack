{{- $entry := . -}}
{{- with site.GetPage .page -}}
  {{- if .Draft }}{{ errorf "Preview references a draft: %s" $entry.page }}{{ end -}}
  <a href="{{ .RelPermalink }}{{ with $entry.anchor }}#{{ . }}{{ end }}"{{ with $entry.class }} class="{{ . }}"{{ end }}>{{ $entry.label | default .Title }}{{ with $entry.arrow }} <span aria-hidden="true">→</span>{{ end }}</a>
{{- else -}}
  {{- errorf "Preview reference not found: %s" .page -}}
{{- end -}}
