routes:
  - key: fullstack
    title: "全栈框架"
    page: "reading/fullstack.md"
    question: "一个功能怎样跨越两端形成闭环？"
    value: "从整体运行模型进入数据契约、多人同步、版本配套与总结 Demo。"
  - key: client
    title: "客户端框架"
    page: "reading/client.md"
    question: "玩家设备上的系统怎样组织和运行？"
    value: "理解启动、异步、资源、UI、生命周期、热更新与小游戏适配。"
  - key: server
    title: "服务端框架"
    page: "reading/server.md"
    question: "玩家请求与共享状态怎样可靠处理？"
    value: "深入会话、Actor、地图实例、业务数据、持久化与恢复。"
benefits:
  - title: "划清职责"
    value: "确定规则由谁执行、状态由谁持有、表现何时更新，让接口与所有权有明确依据。"
  - title: "追踪完整链路"
    value: "从一次操作追到请求、计算、同步与呈现，沿实际边界判断问题出现的位置。"
  - title: "理解版本配套"
    value: "把代码、协议、配置和资源放在同一轮变更中检查，让更新、失败与恢复可以解释。"
engines:
  - title: "通用原理"
    value: "先建立职责、所有权、状态和失败处理模型。"
  - title: "Unity"
    value: "先推进 Unity＋ET 路线，以官方实现与实验支撑文章。"
  - title: "Unreal"
    value: "从已有架构与系统专题进入，逐步补对应机制和工程实践。"
  - title: "跨引擎对照"
    value: "比较同一个问题的实现与取舍，按专题逐步补充。"
lanes:
  fullstack:
    kicker: "学习路径 · 端服协作"
    outcome: "沿一次玩家操作解释两端职责、消息与状态变化，再判断数据、同步和版本怎样配套。"
    start:
      page: "et-framework-prerequisites/et-pre-10-state-sync-lockstep-and-authoritative-server.md"
      value: "先分清权威、同步内容和计算位置，再选择状态同步或帧同步。本文属于 ET9 前置桥接，ET10 实验单独核对。"
    groups:
      - title: "整体运行模型"
        question: "框架中的对象、任务与消息怎样组成同一条执行链？"
        entries:
          - title: "ET 前置桥接"
            page: "et-framework-prerequisites/_index.md"
            scope: "Unity / C# · ET9"
            state: "已有文章"
            value: "建立异步、装配、对象树、网络和 Actor 的最小地图，再进入框架源码。"
          - title: "ET 框架源码解析"
            page: "et-framework/_index.md"
            scope: "Unity / C# · ET9"
            state: "已有文章"
            value: "从运行时骨架、包组织与消息机制，理解框架的设计取舍。"
      - title: "玩法系统的技术实现"
        question: "玩法规则怎样落成可执行、可验证的系统？"
        entries:
          - title: "技能系统"
            page: "system-design/skill-system-series-index.md"
            scope: "通用模型 · Unity 自研与 Unreal GAS 对照"
            state: "已有系列"
            value: "沿输入请求、校验、生命周期、命中、效果、Buff 与表现组织技能执行，再进入多人同步、工具和回归。"
          - title: "游戏编程模式"
            page: "system-design/game-programming-patterns-series-index.md"
            scope: "通用模型 · Unity 应用"
            state: "已有系列"
            value: "理解命令、事件、状态与对象协作怎样组织玩法代码，再按具体问题选择实现。"
      - title: "通信、同步与版本契约"
        question: "两端怎样理解同一份数据，并在延迟和版本变化中协同？"
        entries:
          - title: "状态同步与帧同步"
            page: "system-design/game-backend-sync-01-lockstep-vs-state-sync.md"
            scope: "通用原理"
            state: "已有基础文章 · 对照实验待做"
            value: "比较输入、状态、确定性与权威边界；后续补预测回滚、重放及逐帧校验。"
          - title: "客户端与服务端版本协同"
            page: "delivery-engineering/delivery-server-versioning-series-index.md"
            scope: "通用原理"
            state: "已有系列"
            value: "把协议、配置、资源与代码对应到兼容版本，理解发布和恢复的约束。"
      - title: "配置工具链与总结 Demo"
        question: "怎样把学习问题变成文章、实验和完整游戏流程？"
        entries:
          - title: "Luban 配置工具链"
            scope: "通用模型 · Unity 路线先行"
            state: "专题待规划"
            value: "计划覆盖数据定义、引用校验、生成、加载及两端消费。先从已有配置管线文章建立问题模型。"
            reference: "delivery-engineering/delivery-content-pipeline-04-config-pipeline.md"
            reference_label: "先读配置管线"
          - title: "ET10 学习与全栈总结 Demo"
            scope: "Unity / C# · ET10"
            state: "总结 Demo 待实现"
            value: "以官方示例研究为依据，逐步串起两人副本、两种同步、数据恢复与版本交付；各项单独验收。"
            reference: "system-design/skill-system-00-overview.md"
            reference_label: "先看技能执行链"
  client:
    kicker: "学习路径 · 客户端运行"
    outcome: "解释功能如何启动与退出，资源、界面、事件和异步任务如何协作，再验证更新与平台边界。"
    start:
      page: "engine-toolchain/unity-async-runtime-extra-02-unity-execution-model.md"
      value: "先分清代码在哪个线程、哪个循环阶段执行，再讨论调度和生命周期。"
    groups:
      - title: "执行模型与系统组织"
        question: "功能、状态、任务与对象的生命周期怎样配合？"
        entries:
          - title: "Task / UniTask 与异步运行时"
            page: "engine-toolchain/unity-async-runtime-series-index.md"
            scope: "Unity"
            state: "已有系列"
            value: "沿调度、取消、异常与对象销毁，理解异步执行的完整边界。"
          - title: "游戏编程模式"
            page: "system-design/game-programming-patterns-series-index.md"
            scope: "通用模型 · Unity 应用"
            state: "已有系列"
            value: "从具体问题判断职责、组合与依赖，继续补 Unity 到 ET 的设计桥接。"
      - title: "资源、场景与更新"
        question: "内容何时可用，由谁持有，用完怎样释放，更新怎样生效？"
        entries:
          - title: "YooAsset 资源管理与交付"
            page: "engine-toolchain/unity-yooasset-series-index.md"
            scope: "Unity"
            state: "已有系列"
            value: "沿加载、清单、缓存、生命周期与构建理解资源系统。各文章以自身固定版本为准。"
          - title: "Addressables 与方案对照"
            page: "engine-toolchain/unity-addressables-yooasset-comparison-series-index.md"
            scope: "Unity"
            state: "已有系列入口"
            value: "用共同问题比较资源组织、加载和交付方式，再回到各自实现。"
          - title: "HybridCLR"
            page: "engine-toolchain/hybridclr-series-index.md"
            scope: "Unity / IL2CPP"
            state: "已有系列"
            value: "理解 AOT、热更新代码与运行时边界；总结 Demo 的真实更新实验另行验收。"
      - title: "平台适配与引擎路线"
        question: "平台和引擎变化时，哪些模型可复用，哪些实现要重新验证？"
        entries:
          - title: "小游戏客户端设计"
            scope: "Unity · 平台待选"
            state: "专题待规划 · 真机待验证"
            value: "从首包、分包、缓存、网络、触摸输入和前后台恢复确定适配要求。"
            reference: "performance/game-budget-15-miniapp-platform-budget-wechat-alipay-douyin.md"
            reference_label: "先读小游戏平台预算"
          - title: "Unreal 架构与系统"
            page: "system-design/unreal-engine-series-index.md"
            scope: "Unreal"
            state: "已有系列 · 全栈实践逐步补充"
            value: "进入对象、模块、GAS 和网络等专题，再按同一问题建立跨引擎对照。"
  server:
    kicker: "学习路径 · 服务端运行"
    outcome: "追踪请求、调度、共享状态和数据写入，区分成功响应、实际持久化与故障恢复。"
    start:
      page: "et-framework-prerequisites/et-pre-05-session-request-response-timeout-and-heartbeat.md"
      value: "从客户端熟悉的请求与响应出发，理解会话、超时和心跳，再进入框架机制。"
    groups:
      - title: "会话、调度与地图"
        question: "请求被谁接收，在哪里执行，怎样找到它要操作的状态？"
        entries:
          - title: "ET 网络与 Actor 前置"
            page: "et-framework-prerequisites/_index.md"
            scope: "C# · ET9 前置"
            state: "已有系列"
            value: "建立会话、邮箱、对象树、位置透明与地图分工的基本语义。"
          - title: "ET 框架机制"
            page: "et-framework/_index.md"
            scope: "C# · ET9"
            state: "已有系列 · ET10 分轨研究"
            value: "深入 Fiber、消息、Location 和分布式机制；当前实验路线单独核对版本与结果。"
      - title: "业务规则与玩家数据"
        question: "什么状态需要共享、保存，重复请求或进程重启后怎样保持正确？"
        entries:
          - title: "游戏后端基础"
            page: "system-design/game-backend-series-index.md"
            scope: "通用原理"
            state: "已有系列"
            value: "按网络、服务划分、数据与运行需求选择专题，不把数据库连接成功当作玩家存档完成。"
          - title: "持久化与并发一致性"
            page: "system-design/game-backend-db-04-transaction-and-concurrency.md"
            scope: "通用原理"
            state: "已有文章 · Demo 实验待做"
            value: "将事务、并发与业务不变量接到奖励、背包、任务和恢复场景。"
      - title: "运行、更新与故障反馈"
        question: "怎样解释服务状态、版本兼容与失败恢复？"
        entries:
          - title: "服务端架构与部署"
            page: "delivery-engineering/delivery-server-architecture-series-index.md"
            scope: "通用原理 · 引擎接入"
            state: "已有系列"
            value: "按逻辑服、战斗服及部署需求理解交付边界，衔接工程与交付入口。"
          - title: "服务端运维与可靠性"
            page: "delivery-engineering/delivery-server-operations-series-index.md"
            scope: "通用原理"
            state: "已有系列"
            value: "从日志、监控与恢复路径回到研发判断；总结 Demo 的故障演练单独留证。"
