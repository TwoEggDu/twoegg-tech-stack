delivery_route:
  - title: "内容完整可用"
    value: "制作好的资源与配置，需要完整到达玩家设备，在需要时可用，用完后可释放。由这些要求进入资源组织、分发、加载与生命周期。"
    page: "delivery-engineering/delivery-resource-pipeline-series-index.md"
    more: "engineering-journey/production-resource-completeness.md"
    more_label: "从资源漏提交的实践开始"
  - title: "功能协同运行"
    value: "策划规则、美术表现与程序逻辑需要组成可玩的功能，再处理客户端与服务端的配套。先沿一个技能，理解数据、行为和表现怎样接起来。"
    page: "system-design/skill-system-series-index.md"
    more: "delivery-engineering/delivery-server-versioning-01-coordination.md"
    more_label: "继续看端服版本怎样配套"
  - title: "设备体验达标"
    value: "内容能运行之后，还要在目标设备上及时响应、稳定呈现，并控制内存与加载成本。从玩家感受到的问题进入判断、诊断与验证。"
    page: "reading/performance.md"
    more: "reading/startup-loading.md"
    more_label: "沿启动与加载继续深入"
  - title: "版本持续迭代"
    value: "每次更新都需要明确交付范围与验收依据，保留失败恢复的路径，并让线上反馈推动下一轮改进。由这些要求进入构建、发布、回退与实验。"
    page: "engineering-journey/production-release-readiness.md"
    more: "engineering-journey/production-feedback-loop.md"
    more_label: "看线上问题怎样回到下一版"
