  - title: "项目管理"
    description: "先学习通用项目与团队管理，再进入软件研发应用与游戏研发实践；从 PM-01 管理认识开始阅读。"
    page: "reading/project-management.md"
    key: "management"
    eyebrow: "项目、人员与团队协作"
    start_title: "从管理基础开始"
    start:
      page: "project-management/project-management-01-management-and-results.md"
      value: "从一次培训活动区分活动、产出与实际效果，理解管理怎样影响团队结果；接着读 PM-04—07，把目标、范围与验收接到工作分解、依赖、进度及资源成本安排。其余主题逐篇补充。"
    sections:
      - id: "foundations"
        title: "先学通用基础"
        note: "五组知识可以独立学习，不要求游戏或引擎背景。PM-01、PM-02、PM-03、PM-04、PM-05、PM-06、PM-07、PM-08、PM-09、PM-10、PM-11、PM-12、PM-13、PM-14、PM-15、PM-16、PM-17、PM-18、PM-19、PM-20、PM-21、PM-22、PM-23 已有正文；研发应用与游戏实践从下一组入口继续。"
        entries:
          - { label: "角色、责任与决策权 · PM-02 正文", page: "project-management/project-management-02-roles-responsibility-authority.md", value: "用局部 RACI 与决定权限表说明谁执行、谁确认、谁能决定，以及资源冲突怎样升级。" }
          - { label: "项目、运营与推进方式 · PM-03 正文", page: "project-management/project-management-03-projects-operations-approaches.md", value: "比较预测、迭代、增量与混合安排，从关键未知、反馈和变化代价说明选择及调整条件。" }
          - { label: "目标、范围与验收 · PM-04 正文", page: "project-management/project-management-04-goals-scope-acceptance.md", value: "分清目标、需求、交付物与任务，用一页项目说明约定范围、检查证据和确认责任。" }
          - { label: "工作分解 · PM-05 正文", page: "project-management/project-management-05-work-breakdown.md", value: "用 WBS 覆盖范围，明确工作包的输入、完成证据与交接，再连接活动和排期。" }
          - { label: "依赖、估算与进度 · PM-06 正文", page: "project-management/project-management-06-dependencies-estimation-schedule.md", value: "区分工时与工期，复算关键路径和总时差，再用人员冲突与等待检查安排是否可执行。" }
          - { label: "资源、成本与外部协作 · PM-07 正文", page: "project-management/project-management-07-resources-costs-procurement.md", value: "核对可用能力与时间，复算直接支出和未付承诺，用交付约定把外部工作接进计划。" }
          - { label: "风险与问题 · PM-08 正文", page: "project-management/project-management-08-risks-and-issues.md", value: "用原因、事件与影响描述风险，明确应对、触发与责任，再把已发生的障碍接到问题处理。" }
          - { label: "需求与范围变化 · PM-09 正文", page: "project-management/project-management-09-change-control.md", value: "核对原约定、变更影响与决定权限，再把批准结果落实到计划、通知和实施检查。" }
          - { label: "质量、验收与收尾 · PM-10 正文", page: "project-management/project-management-10-quality-acceptance-closure.md", value: "用对象、标准和证据判断交付，明确接收决定、遗留责任、资料移交与后续收益观察。" }
          - { label: "任务相关成熟度 · PM-11 正文", page: "project-management/project-management-11-task-relevant-maturity.md", value: "根据具体任务和已有证据调整指导、自主空间与检查，分清能力、信息和资源障碍。" }
          - { label: "授权与检查 · PM-12 正文", page: "project-management/project-management-12-delegation-and-follow-up.md", value: "把结果、决定权限、资源、检查和升级写成一页约定，交接任务时也交代协作入口。" }
          - { label: "培养与激励 · PM-13 正文", page: "project-management/project-management-13-development-and-motivation.md", value: "把能力缺口接到示范、独立练习与反馈，核对双方投入和工作条件，再观察实际应用。" }
          - { label: "反馈与表现讨论 · PM-14 正文", page: "project-management/project-management-14-feedback-and-performance.md", value: "核对原约定、工作事实与条件，听取补充，把具体反馈接到双方行动和复查。" }
          - { label: "干系人分析 · PM-15 正文", page: "project-management/project-management-15-stakeholder-engagement.md", value: "识别受影响者、权限和关切，用参与矩阵与登记表安排沟通、责任和复核时点。" }
          - { label: "信息流与沟通 · PM-16 正文", page: "project-management/project-management-16-information-and-communication.md", value: "区分状态、问题、风险与决定，选择同步或异步方式，把沟通接到回应、行动和当前记录。" }
          - { label: "一对一沟通 · PM-17 正文", page: "project-management/project-management-17-one-on-ones.md", value: "用共同议题、倾听与澄清了解工作困难，确认双方支持与行动，并按实际需要调整沟通安排。" }
          - { label: "会议组织 · PM-18 正文", page: "project-management/project-management-18-meetings.md", value: "从是否开会到参与者、决定权限、议程与行动记录，让一次讨论接到可跟进的工作。" }
          - { label: "决策与冲突 · PM-19 正文", page: "project-management/project-management-19-decisions-and-conflict.md", value: "辨别分歧，比较选项与代价，明确决定权限，把理由、异议、执行与复查条件写进记录。" }
          - { label: "度量与偏差 · PM-20 正文", page: "project-management/project-management-20-measurement-and-variance.md", value: "明确指标口径与分母，比较计划、预测和实际，用成对信号与最小看板连接核查和行动。" }
          - { label: "原因分析 · PM-21 正文", page: "project-management/project-management-21-cause-analysis.md", value: "用帕累托图安排调查重点，用鱼骨图与连续追问组织候选原因，再以证据和反例核查。" }
          - { label: "复盘与改进行动 · PM-22 正文", page: "project-management/project-management-22-retrospectives-and-actions.md", value: "还原事实和当时信息，比较少量改进，约定责任与复查，分别观察动作完成、采用和结果。" }
          - { label: "做法的使用与维护 · PM-23 正文", page: "project-management/project-management-23-practice-adoption-and-maintenance.md", value: "比较持续使用的不同办法，约定入口、维护与学习支持，处理版本变化、采用观察和停用交接。" }
          - { label: "管理的基本认识 · 01—03", page: "project-management/project-management-series-index.md", anchor: "foundations", value: "理解活动与结果、责任与决策权、项目与日常运营，再选择适合工作的推进方式。" }
          - { label: "把项目组织起来 · 04—10", page: "project-management/project-management-series-index.md", anchor: "projects", value: "从目标与验收进入工作分解、估算、资源与成本、风险、变更和收尾，形成完整项目主线。" }
          - { label: "带领与培养人员 · 11—14", page: "project-management/project-management-series-index.md", anchor: "people", value: "根据具体任务调整支持方式，明确授权与检查，安排培养、激励和有依据的反馈。" }
          - { label: "沟通、会议与决策 · 15—19", page: "project-management/project-management-series-index.md", anchor: "communication", value: "识别信息需求，组织一对一和会议，处理分歧，让决定接到负责人、期限与完成标准。" }
          - { label: "发现问题与持续改进 · 20—23", page: "project-management/project-management-series-index.md", anchor: "improvement", value: "从度量与偏差进入原因验证、复盘行动和持续采用，分别观察动作完成与实际效果。" }
      - id: "tools"
        title: "按问题查方法与工具"
        note: "先理解工具回答什么，再看输入、用法和局限。已提供职责与决定权限表、项目说明、WBS、工作包样表、依赖网络与排期算例、资源成本表与外部交付草案、风险登记与概率—影响矩阵、变更记录、验收与收尾清单、培养计划与时间预算、反馈准备与双方行动表、干系人登记与参与矩阵、沟通计划与状态更新、一对一议题及双方约定、会议议程与行动记录、选项比较与决策记录、指标定义与行动看板、复盘行动与复查表、做法维护说明、探索任务与检查点记录、鱼骨图与帕累托图；其他工具和软件实操逐篇补充。"
        entries:
          - { label: "拆解与排期", page: "project-management/project-management-series-index.md", anchor: "tools-planning", value: "WBS、依赖网络、关键路径、甘特图、资源与成本表：把范围和约束转成可讨论的计划。" }
          - { label: "分工与沟通", page: "project-management/project-management-series-index.md", anchor: "tools-collaboration", value: "RACI、干系人分析、沟通计划、会议议程与决定记录：明确参与方式和后续行动。" }
          - { label: "风险与诊断", page: "project-management/project-management-series-index.md", anchor: "tools-diagnosis", value: "风险登记表、时间线、鱼骨图、5 Whys 与帕累托图：整理不确定性和候选原因，再用证据核实。" }
          - { label: "跟踪与软件实操", page: "project-management/project-management-series-index.md", anchor: "tools-tracking", value: "看板、在制品限制、周期时间与行动跟进；再看 Jira、飞书、Excel、Microsoft Project 怎样承载共同模型。" }
      - id: "applications"
        title: "再进入研发场景"
        note: "先把通用知识用到软件研发，再讨论游戏内容生产与版本推进。PM-24已有正文与教学推演；其余应用保留提纲，软件实操和真实案例另行验证。"
        entries:
          - { label: "探索性工作的估算与检查点 · PM-24 正文", page: "project-management/project-management-24-exploration-estimates-and-checkpoints.md", value: "限定探索投入，设计能改变选择的原型证据，按检查点决定继续、转向或停止，并更新计划。" }
          - { label: "软件研发中的应用 · 24—27", page: "project-management/project-management-series-index.md", anchor: "research", value: "探索性工作怎样估算，需求怎样进入迭代，跨团队怎样集成验收，管理软件怎样连接工作记录。" }
          - { label: "游戏研发管理实践 · 28—32", page: "project-management/project-management-series-index.md", anchor: "game-practice", value: "围绕版本目标、跨工种交接、生产卡点与上线准备，逐步补充有职责和证据边界的实践；目前为提纲。" }
      - id: "references"
        title: "参考阅读"
        note: "围绕问题组织文章，结合书籍建立知识基础。正文将标注实际使用的版本、章节与其他资料。"
        entries:
          - { label: "格鲁夫给经理人的第一课", page: "project-management/project-management-series-index.md", anchor: "references", value: "Andrew S. Grove：理解管理产出、管理者的工作、人员培养、授权与会议。" }
          - { label: "项目管理之美", page: "project-management/project-management-series-index.md", anchor: "references", value: "Scott Berkun：理解项目计划、沟通、决策、信任和实际推进中的困难。" }
          - { label: "PMBOK 指南", page: "project-management/project-management-series-index.md", anchor: "references", value: "Project Management Institute：核对体系与术语覆盖；引用时说明版本，区分各版结构与侧重点。" }
    directory: "project-management/project-management-series-index.md"
  - title: "GamePlay"
    description: "理解游戏的可玩性，分析技能、战斗、剧情、角色养成与玩法循环的设计。"
    page: "reading/gameplay.md"
    key: "gameplay"
    eyebrow: "游戏设计与可玩性"
    focus_title: "从玩家体验理解游戏设计"
    focus_note: "已按五组主题建立阅读索引与 24 篇章节提纲，正文与真实游戏案例将逐篇补充。操作与反馈纳入可玩性主线。"
    focus:
      - title: "可玩性与玩家选择"
        value: "玩家在观察什么、判断什么、承担什么风险？从目标、挑战、选择与反馈，分析一个机制为什么能带来乐趣，以及它在什么条件下成立。"
      - title: "技能与战斗设计"
        value: "技能定位、资源消耗、时机、空间、组合和反制，怎样形成不同打法？继续看敌人、关卡与遭遇怎样让玩家的能力产生新用途。"
      - title: "操作与体验反馈"
        value: "角色控制、动作、相机、声音和界面怎样支持玩家表达意图、理解结果？从响应、节奏与信息呈现讨论操作体验。"
