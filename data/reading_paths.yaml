        value: "角色控制、动作、相机、声音和界面怎样支持玩家表达意图、理解结果？从响应、节奏与信息呈现讨论操作体验。"
      - title: "剧情与角色关系"
        value: "剧情怎样赋予行动意义，角色关系怎样影响选择？讨论叙事、探索、任务与玩法过程如何配合。"
