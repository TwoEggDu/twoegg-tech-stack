handoffs:
  - title: "策划 × 客户端"
    value: "把玩法规则与配置约定转成可执行的数据和行为，再通过工具与运行反馈共同调整。"
    page: "system-design/skill-system-27-designer-data-pipeline.md"
    label: "沿一个技能看配置怎样进入运行时"
  - title: "策划 × 美术"
    value: "把玩法意图与表现需求对齐，约定动画、特效和音效的时序，以及最终效果的验收标准。"
    page: "system-design/skill-system-28-artist-vfx-delivery-standard.md"
    label: "从技能表现看需求怎样落到制作与验收"
  - title: "策划 × QA"
    value: "把规则与预期结果变成可检查的场景，明确边界条件；需求变化时，同步调整验证与回归范围。"
    page: "system-design/skill-system-13-testing-and-regression.md"
    label: "从技能规则看测试与回归怎样组织"
  - title: "美术 × 客户端"
    value: "把资源、引用与表现约定，接到版本库、构建产物和设备实际内容。"
    page: "engineering-journey/production-resource-completeness.md"
    label: "从一次资源漏提交看交接怎样补齐"
  - title: "客户端 × 服务端"
    value: "从客户端的协议、配置与更新需求，继续检查两端版本怎样配套。"
    page: "delivery-engineering/delivery-server-versioning-01-coordination.md"
    label: "看客户端与服务端的版本协同"
  - title: "研发 × QA × 发布"
    value: "围绕同一份候选，交接变更范围、检查结果、测试结论与发布内容。"
    page: "engineering-journey/production-release-readiness.md"
    label: "看一份候选怎样经过验收与发布交接"
